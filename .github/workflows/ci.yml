name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · test:utc · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # GitHub's machines run on UTC. This step does NOT set a timezone:
      # jest.config.ts pins the run to Asia/Manila itself, so a green result
      # here is proof the pinning works on a machine that is 8 hours behind.
      - name: Test (Asia/Manila)
        run: npm test

      # The same suite in the runner's own zone. Date code that is right in
      # only one timezone fails here.
      - name: Test (UTC)
        run: npm run test:utc

      - name: Build
        run: npm run build
